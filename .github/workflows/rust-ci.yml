# SPDX-License-Identifier: MPL-2.0
# Rust CI — thin wrapper calling the shared estate reusable in
# hyperpolymath/standards. Configure once, propagate everywhere.
# See: docs/CI-REUSABLE-WORKFLOWS.adoc in standards.
#
# Why a wrapper and not a bespoke job list: the estate audit of 2026-05-26
# found 137 repos each shipping their own copy of rust-ci.yml across 30
# unique SHAs — the same logical gate, drifted independently. This repo was
# one of the ones shipping NO gate at all (#45): 59 `#[test]` functions had
# never run in CI, so a green PR said nothing about the Rust code.
#
# Pinned to the SAME standards commit as governance.yml and hypatia-scan.yml
# in this repo, so all three wrappers move together when Dependabot bumps the
# estate pin. What the reusable runs, per job:
#
#   detect → Cargo.toml presence (a checked-out step, not a job-level
#            hashFiles(), which is evaluated before checkout and always
#            returns '' — the bug that silently skipped every job)
#   check  → cargo check --locked --all-targets
#            cargo fmt --all -- --check
#            cargo clippy --locked --all-targets -- -D warnings
#   test   → cargo test --locked --all-targets
#
# The job names below are static and unmatrixed on purpose (#45 AC3): the
# rendered check names ("rust-ci / Cargo test" and friends) have to be stable
# before they can be made required contexts.
name: Rust CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  rust-ci:
    uses: hyperpolymath/standards/.github/workflows/rust-ci-reusable.yml@81dbf2dd854b1444fd6236fa2352474383b2c2b9
