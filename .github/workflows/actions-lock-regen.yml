# SPDX-License-Identifier: MPL-2.0
# TEMPORARY — regenerates .github/workflows/actions.lock with the
# authoritative tool, then deletes itself.
#
# `gh actions-lock` is #45 AC4's required generator: the lockfile may never be
# hand-edited, and the default (narrow) fix mode de-pins SHA refs to floating
# tags, so `--no-narrow` is the only acceptable invocation. The extension
# binary is distributed through release-assets.githubusercontent.com, which
# this development sandbox cannot reach, so the tool is run here instead —
# inside CI, where it can be installed — and the result committed back.
#
# This file is removed in the same change that lands the lockfile it produces.
name: Regenerate actions.lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}

      - name: Install gh actions-lock
        run: |
          gh extension install github/gh-actions-lock
          gh actions-lock --version

      - name: Regenerate the lockfile (--no-narrow: keep every SHA pin)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh actions-lock --no-narrow

      - name: Show what it did
        run: |
          git --no-pager diff --stat
          echo "--- actions.lock ---"
          cat .github/workflows/actions.lock

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/actions.lock .github/workflows/*.yml
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: regenerate .github/workflows/actions.lock with gh actions-lock --no-narrow"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
