# SPDX-License-Identifier: MPL-2.0
# Launcher artefact gates — the checks that belong to THIS repo and cannot live
# in the estate's rust-ci-reusable.yml.
#
#   1. test-count floor (#45 AC6). `cargo test` exits 0 on a suite that
#      collected nothing, so "the job is green" is not evidence any test ran.
#      The floor is a ratchet: raise it as tests are added, never lower it.
#   2. shellcheck over a launcher MINTED DURING THE RUN (#49 AC4/AC5). The
#      `.tera` source is not valid shell, so linting the template file cannot
#      work — only a minted artefact can be linted. And a linter that finds
#      zero files to lint has failed, not passed, so that case exits non-zero.
#   3. fixture currency (#48 AC5, #49 AC6). The committed deed fixture must be
#      byte-identical to what today's mint emits, so the artefacts the scanners
#      read are the artefacts the tool actually produces.
#
# The committed PRE-phase-2 fixture
# (minted-2026-09-22_stapeln-launcher.sh) is deliberately neither linted nor
# currency-checked: it is a frozen historical artefact, the evidence that a
# launcher minted by the old emitter still reads (#40). See
# crates/launcher-common/tests/fixtures/metadata_block/README.adoc.
#
# ⚠ Two conventions every step below follows, both learned the hard way:
#
# * Each `run:` starts with `set +e`. GitHub invokes bash with `-eo pipefail`,
#   so a command that is EXPECTED to be able to fail — `cargo fmt --check` on a
#   dirty tree, `cargo test` with a failing test, `diff` on drifted files —
#   kills the step before it can report what it found. The first version of this
#   file died that way and reported only "Process completed with exit code 1".
#   Each step handles its own status and ends in an explicit `exit`.
# * Each step sources `$RUNNER_TEMP/annotate.sh`. A failure whose detail lives
#   only in the run log is a failure a reviewer cannot act on, and the log is
#   not reachable from every environment; annotations are.
name: Launcher artefacts

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # #45 AC6: the count must be non-zero and >= 59 (the number of #[test]
  # functions measured when the gap was filed). Ratchet upward, never lower.
  TEST_COUNT_FLOOR: "59"
  FIXTURE_CONFIG: crates/launcher-common/tests/fixtures/config/stapeln.launcher.fixture.a2ml
  FIXTURE_SCRIPT: crates/launcher-common/tests/fixtures/metadata_block/minted-2026-09-23_stapeln-launcher-deed.sh
  # The three codes #49 fixed, pinned at EVERY severity so a regression cannot
  # slip under the warning-level gate by being reclassified.
  BANNED_SHELLCHECK_CODES: SC2034 SC2001 SC2155

jobs:
  launcher-artefacts:
    name: Build, count, mint, lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        # `toolchain:` is mandatory under a SHA pin: dtolnay/rust-toolchain
        # infers the toolchain from the `@`-ref, and a SHA carries no version.
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install the annotation helper
        shell: bash
        run: |
          set +e
          cat > "$RUNNER_TEMP/annotate.sh" <<'HELPER'
          # annotate TITLE FILE [MAXLINES]
          # Re-emit the head of FILE as a single check annotation, percent-encoded
          # so GitHub renders the line breaks. Titles must not contain "::".
          annotate() {
            local title="$1" file="$2" max="${3:-60}" body
            body=$(awk -v max="$max" '
              NR <= max {
                gsub(/%/, "%25"); gsub(/\r/, "%0D")
                printf "%s%s", sep, $0; sep = "%0A"
              }
              END { if (NR > max) printf "%s… %d more line(s) in the run log", sep, NR - max }
            ' "$file")
            echo "::error title=${title}::${body}"
          }
          HELPER
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/annotate.sh"
          type annotate >/dev/null && echo "✓ annotate helper installed"
          exit 0

      - name: Report rustfmt drift as an annotation
        shell: bash
        run: |
          set +e
          set -uo pipefail
          . "$RUNNER_TEMP/annotate.sh"
          # Diagnostic, not a second gate: formatting is gated by the estate
          # reusable (rust-ci.yml) and this step never fails the job.
          cargo fmt --all -- --check > "$RUNNER_TEMP/fmt.diff" 2>&1
          if [ -s "$RUNNER_TEMP/fmt.diff" ]; then
            echo "rustfmt wants changes ($(wc -l < "$RUNNER_TEMP/fmt.diff") line(s)):"
            cat "$RUNNER_TEMP/fmt.diff"
            annotate "cargo fmt --check drift" "$RUNNER_TEMP/fmt.diff" 80
          else
            echo "✓ cargo fmt --all -- --check is clean"
          fi
          exit 0

      - name: Build every target
        shell: bash
        run: |
          set +e
          . "$RUNNER_TEMP/annotate.sh"
          cargo build --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/build.log"
          STATUS="${PIPESTATUS[0]}"
          if [ "$STATUS" -ne 0 ]; then
            annotate "cargo build --all-targets failed" "$RUNNER_TEMP/build.log" 60
          fi
          exit "$STATUS"

      - name: Run the suite and count what actually ran
        shell: bash
        run: |
          set +e
          set -uo pipefail
          . "$RUNNER_TEMP/annotate.sh"
          LOG="$RUNNER_TEMP/cargo-test.log"
          cargo test --locked --all 2>&1 | tee "$LOG"
          STATUS="${PIPESTATUS[0]}"

          # Sum the `N passed` of every `test result:` line the run printed —
          # one line per test binary, so a crate that silently stopped
          # collecting shows up as a shortfall in the total rather than as a
          # smaller number of lines.
          read -r PASSED FAILED < <(awk '
            /^test result:/ {
              for (i = 1; i <= NF; i++) {
                if ($i == "passed;") { p += $(i - 1) }
                if ($i == "failed;") { f += $(i - 1) }
              }
            }
            END { printf "%d %d", p + 0, f + 0 }
          ' "$LOG")

          echo "cargo test exit status: $STATUS"
          echo "tests passed: $PASSED   failed: $FAILED   floor: $TEST_COUNT_FLOOR"
          {
            echo "## Launcher artefact gates"
            echo ""
            echo "- cargo test --all: **$PASSED passed**, $FAILED failed (floor $TEST_COUNT_FLOOR)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" -ne 0 ]; then
            sed -n '/^failures:$/,$p' "$LOG" | head -120 > "$RUNNER_TEMP/failures.txt"
            if [ ! -s "$RUNNER_TEMP/failures.txt" ]; then
              tail -60 "$LOG" > "$RUNNER_TEMP/failures.txt"
            fi
            annotate "cargo test failed" "$RUNNER_TEMP/failures.txt" 100
            exit "$STATUS"
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::$FAILED test(s) failed"
            exit 1
          fi
          if [ "$PASSED" -lt "$TEST_COUNT_FLOOR" ]; then
            echo "::error title=test-count floor::only $PASSED tests ran; the floor is $TEST_COUNT_FLOOR. A suite that collects nothing exits 0, so this gate is what makes green mean ran (#45 AC6)."
            exit 1
          fi
          exit 0

      - name: Mint a launcher from the committed fixture config
        shell: bash
        run: |
          set +e
          set -uo pipefail
          OUT="$RUNNER_TEMP/minted"
          mkdir -p "$OUT"
          # `--stdout` so nothing is written next to the fixture config.
          # CONFIG_FILE is normalised because mint embeds the CANONICALISED
          # absolute path of the config that produced the script, which is
          # checkout-location-specific by design and not a template property.
          ./target/debug/launch-scaffolder mint "$FIXTURE_CONFIG" --stdout \
            | sed -E 's|^CONFIG_FILE=.*|CONFIG_FILE=""|' \
            > "$OUT/stapeln-launcher.sh"
          STATUS="${PIPESTATUS[0]}"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error title=mint failed::launch-scaffolder mint exited $STATUS"
            exit "$STATUS"
          fi
          chmod +x "$OUT/stapeln-launcher.sh"
          echo "minted $(wc -l < "$OUT/stapeln-launcher.sh") lines"
          exit 0

      - name: Committed fixture is byte-identical to a fresh mint
        shell: bash
        run: |
          set +e
          set -uo pipefail
          . "$RUNNER_TEMP/annotate.sh"
          MINTED="$RUNNER_TEMP/minted/stapeln-launcher.sh"
          diff -u "$FIXTURE_SCRIPT" "$MINTED" > "$RUNNER_TEMP/fixture.diff"
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            echo "✓ $FIXTURE_SCRIPT is byte-identical to a fresh mint"
            exit 0
          fi
          cat "$RUNNER_TEMP/fixture.diff"
          annotate "committed fixture drifted from what mint emits today" \
            "$RUNNER_TEMP/fixture.diff" 80
          echo "::notice::re-mint it rather than editing it by hand — see crates/launcher-common/tests/fixtures/metadata_block/README.adoc"
          exit 1

      - name: Shellcheck the minted launcher
        shell: bash
        run: |
          set +e
          set -uo pipefail
          . "$RUNNER_TEMP/annotate.sh"
          command -v shellcheck >/dev/null || {
            echo "::error::shellcheck is not installed on the runner"; exit 1; }
          shellcheck --version | sed -n '2,3p'

          mapfile -t FILES < <(find "$RUNNER_TEMP/minted" -type f -name '*.sh' | sort)

          # #49 AC5: zero files is a failure, not a pass.
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error title=nothing to lint::the shellcheck gate found ZERO files to lint — a linter with nothing to lint has failed, not passed"
            exit 1
          fi
          printf 'linting %d minted artefact(s):\n' "${#FILES[@]}"
          printf '  %s\n' "${FILES[@]}"

          # Hard gate: nothing at warning or above (#49 AC2).
          shellcheck --format=gcc --severity=warning "${FILES[@]}" \
            > "$RUNNER_TEMP/sc-warning.txt" 2>&1
          if [ -s "$RUNNER_TEMP/sc-warning.txt" ]; then
            cat "$RUNNER_TEMP/sc-warning.txt"
            annotate "shellcheck findings in a freshly minted launcher" \
              "$RUNNER_TEMP/sc-warning.txt" 60
            echo "::notice::the fix belongs in templates/launcher.sh.tera, never in the committed fixtures"
            exit 1
          fi

          # Pinned gate: the three codes #49 fixed must stay fixed at ANY
          # severity, so a reclassification cannot hide a regression.
          shellcheck --format=gcc "${FILES[@]}" > "$RUNNER_TEMP/sc-all.txt" 2>&1
          for code in $BANNED_SHELLCHECK_CODES; do
            if grep -q "\[$code\]" "$RUNNER_TEMP/sc-all.txt"; then
              grep "\[$code\]" "$RUNNER_TEMP/sc-all.txt"
              echo "::error title=$code is back::a freshly minted launcher trips $code again (#49)"
              exit 1
            fi
          done

          echo "✓ zero findings at warning+; $BANNED_SHELLCHECK_CODES all absent"
          if [ -s "$RUNNER_TEMP/sc-all.txt" ]; then
            echo "--- remaining sub-warning notes, for the record ---"
            cat "$RUNNER_TEMP/sc-all.txt"
          fi
          exit 0
